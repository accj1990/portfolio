<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Contato - Ana Carolina Conceição de Jesus</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: 'Raleway', sans-serif;
      background-color: #f9f9f9;
      color: #222;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #2e7dcc;
      color: white;
      padding: 2em 1em;
      text-align: center;
    }

    .logo-empresa img {
      max-height: 50px;
      margin-bottom: 0.5em;
    }

  .header-links {
    margin: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px; /* Espaço entre os links */
    justify-content: center;
  }
  .header-links a {
    color: white;
    text-decoration: none;
    padding: 0.5em 1em;
    border: 1px solid white;
    border-radius: 5px;
    transition: background-color 0.2s, color 0.2s;
  }
  .header-links a:hover {
    background-color: white;
    color: var(--primary);
  }

    .section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 2rem 1rem;
      flex: 1;
    }

    #form-contato {
      display: flex;
      flex-direction: column;
      gap: 1em;
      max-width: 600px;
      width: 100%;
    }

    #form-contato label {
      font-weight: bold;
      text-align: left;
    }

    #form-contato input,
    #form-contato textarea {
      padding: 0.8em;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: inherit;
      width: 100%;
      box-sizing: border-box;
    }

    #form-contato button {
      padding: 0.8em 1.5em;
      background-color: #2e7dcc;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      width: fit-content;
      align-self: center;
      transition: opacity 0.2s;
    }

    #form-contato button:hover {
      opacity: 0.9;
    }

    #msg {
      text-align: center;
      font-size: 0.9rem;
      color: green;
      margin-top: 0.5em;
    }

    .footer {
      text-align: center;
      font-size: 0.9rem;
      color: #666;
      padding: 2rem 1rem 1rem;
    }

    .idiomas-options{
      text-align: right;
    }

    /* Responsividade */
    @media (max-width: 768px) {
      header {
        padding: 1.5em 1em;
      }

      .header-links {
        gap: 0.5rem;
      }

      #form-contato {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 1.5em;
      }

      .cargoT {
        font-size: 1em;
      }

      #form-contato button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="idiomas-options">
        <div class="header-links">
            <a href="fale-conosco.html"><i class="fa fa-flag"></i> PT-BR</a>
            <a href="fale-conosco-en.html"><i class="fa fa-flag-usa"></i> EN</a>
        </div>
    </div>
    <h1>ANA CAROLINA CONCEIÇÃO DE JESUS</h1>
    <p class="cargoT">Desenvolvedora de Sistemas | Professora | Consultora</p>

    <div class="header-links">
      <a href="index.html"><i class="fa fa-id-card"></i> Currículo</a>
      <a href="trabalhos.html"><i class="fa fa-briefcase"></i> Portfólio</a>
      <a href="participacao-bancas.html"><i class="fa fa-graduation-cap"></i> Participação em Bancas</a>
    </div>
  </header>

  <section id="contato" class="section">
    <h2>Contato</h2>
    <form id="form-contato">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="user_name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="user_email" required>

      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="message" rows="6" required></textarea>

      <button type="submit">Enviar Mensagem</button>
      <p id="msg"></p>
    </form>
  </section>

  <footer class="footer">
    &copy; 2025 Ana Carolina Conceição de Jesus. Todos os direitos reservados.
  </footer>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    emailjs.init("l3ZwuITHs5crdn6jo"); // substitua pelo seu Public Key

    const form = document.getElementById('form-contato');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      emailjs.sendForm('service_gnac2jx', 'template_5n3q2lt', this)
        .then(function() {
          msg.textContent = 'Mensagem enviada com sucesso!';
          msg.style.color = 'green';
          form.reset();
        }, function(error) {
          msg.textContent = 'Erro ao enviar a mensagem. Tente novamente.';
          msg.style.color = 'red';
          console.error(error);
        });
    });
  </script>
</body>
</html>
