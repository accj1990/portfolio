<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form - Ana Carolina Conceição de Jesus</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style-padrao.css">
  <link rel="stylesheet" href="cabecalho-padrao.css">
  <style>
    body {
      margin: 0;
      font-family: 'Raleway', sans-serif;
      background-color: #f9f9f9;
      color: #222;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

   .section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 2rem 1rem;
      flex: 1;
    }

    #contact-form {
      display: flex;
      flex-direction: column;
      gap: 1em;
      max-width: 600px;
      width: 100%;
    }

    #contact-form label {
      font-weight: bold;
      text-align: left;
    }

    #contact-form input,
    #contact-form textarea {
      padding: 0.8em;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: inherit;
      width: 100%;
      box-sizing: border-box;
    }

    #contact-form button {
      padding: 0.8em 1.5em;
      background-color: #2e7dcc;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      width: fit-content;
      align-self: center;
      transition: opacity 0.2s;
    }

    #contact-form button:hover {
      opacity: 0.9;
    }

    #msg {
      text-align: center;
      font-size: 0.9rem;
      color: green;
      margin-top: 0.5em;
    }

    @media (max-width: 768px) {
      #contact-form { width: 100%; }
      #contact-form button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="language-options">
        <div class="header-links">
            <a href="fale-conosco.html"><i class="fa fa-flag"></i> PT-BR</a>
            <a href="fale-conosco-en.html"><i class="fa fa-flag-usa"></i> EN</a>
        </div>
    </div>
    <h1>ANA CAROLINA CONCEIÇÃO DE JESUS</h1>
    <p class="cargoT">Systems Developer | Professor | Consultant</p>

    <div class="header-links">
      <a href="index-en.html"><i class="fa fa-id-card"></i> Resume</a>
      <a href="trabalhos-en.html"><i class="fa fa-briefcase"></i> Portfolio</a>
      <a href="participacao-bancas-en.html"><i class="fa fa-graduation-cap"></i> Academic Committees</a>
  </header>

  <section id="contact" class="section">
    <h2>Contact</h2>
    <form id="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="user_name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="user_email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit">Send Message</button>
      <p id="msg"></p>
    </form>
  </section>

  <footer class="footer">
    &copy; <span id="ano"></span> Ana Carolina Conceição de Jesus. All rights reserved.
  <script>
    document.getElementById('ano').textContent = new Date().getFullYear();
  </script>
  </footer>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    emailjs.init("l3ZwuITHs5crdn6jo"); // replace with your Public Key

    const form = document.getElementById('contact-form');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      emailjs.sendForm('service_gnac2jx', 'template_5n3q2lt', this)
        .then(function() {
          msg.textContent = 'Message sent successfully!';
          msg.style.color = 'green';
          form.reset();
        }, function(error) {
          msg.textContent = 'Failed to send message. Please try again.';
          msg.style.color = 'red';
          console.error(error);
        });
    });
  </script>
</body>
</html>
